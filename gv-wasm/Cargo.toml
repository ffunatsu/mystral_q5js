[package]
name = "gv_wasm"
version = "0.1.0"
edition = "2021"
description = "GV stream/decode support for Mystral WASM integration"
license = "BSD-3-Clause"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
byteorder = "1"
lz4_flex = "0.14"
wasm-bindgen = "0.2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"
